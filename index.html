<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>غسيل بيانات الخريطة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style> body { font-family: 'Cairo', sans-serif; background-color: #060F1D; color: white; } </style>
</head>
<body class="p-5 flex flex-col items-center justify-center min-h-screen">
    
    <div class="max-w-md w-full bg-[#0A1628] rounded-3xl p-6 border border-white/10 shadow-2xl text-center">
        
        <div class="w-16 h-16 bg-[#F5B800] rounded-2xl flex items-center justify-center mx-auto mb-4">
            <svg class="w-8 h-8 text-[#060F1D]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 2v20m-6-10h12m-12 4h12m-12-8h12"></path>
            </svg>
        </div>

        <h1 class="text-2xl font-black text-[#F5B800] mb-2">غسيل ملف الـ JSON</h1>
        <p class="text-xs text-white/50 mb-6 font-bold leading-relaxed">قم باختيار الملف المسحوب من Apify لتنظيفه تماماً من بيانات جوجل المعقدة وتحويله لهيكل خفيف وآمن.</p>
        
        <!-- زر اختيار الملف -->
        <input type="file" id="jsonInput" accept=".json" class="hidden" onchange="cleanFile(event)">
        <label for="jsonInput" class="block w-full border-2 border-dashed border-[#F5B800]/50 rounded-2xl py-8 cursor-pointer hover:bg-white/5 transition mb-6">
            <span id="fileName" class="text-sm font-bold text-white/80">اضغط هنا لاختيار الملف</span>
        </label>
        
        <!-- منطقة النتيجة والتحميل -->
        <div id="result" class="hidden animate-pulse">
            <p class="text-sm text-emerald-400 font-black mb-4" id="stats"></p>
            <button onclick="downloadCleanFile()" class="w-full bg-[#F5B800] text-[#060F1D] font-black py-4 rounded-xl shadow-[0_8px_20px_rgba(245,184,0,0.3)] active:scale-95 transition-transform">
                تحميل الملف النظيف
            </button>
        </div>

    </div>

    <script>
        let cleanData = [];

        function cleanFile(event) {
            const file = event.target.files[0];
            if (!file) return;
            document.getElementById('fileName').textContent = "تم اختيار: " + file.name;
            document.getElementById('fileName').classList.replace('text-white/80', 'text-[#F5B800]');
            
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const rawData = JSON.parse(e.target.result);
                    
                    // عملية الغسيل: استخراج الإحداثيات والأسماء فقط بأسماء متغيرات مختصرة جداً لتقليل حجم الملف
                    cleanData = rawData.map(item => ({
                        n: item.title || "مكان غير معروف", // Name
                        c: item.categoryName || "أخرى",      // Category
                        lat: item.location?.lat || 0,        // Latitude
                        lng: item.location?.lng || 0         // Longitude
                    })).filter(item => item.lat !== 0 && item.lng !== 0); // فلترة الأماكن التي لا تحتوي على موقع دقيق

                    document.getElementById('stats').textContent = `نجاح! تم تنظيف وتأمين ${cleanData.length} معلم جغرافي.`;
                    document.getElementById('result').classList.remove('hidden');
                    document.getElementById('result').classList.remove('animate-pulse');

                } catch (err) {
                    alert('عذراً، الملف الذي قمت باختياره غير صالح أو ليس بصيغة JSON صحيحة.');
                }
            };
            reader.readAsText(file);
        }

        function downloadCleanFile() {
            // تحويل البيانات النظيفة إلى ملف جديد
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(cleanData));
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", dataStr);
            downloadAnchorNode.setAttribute("download", "alak_tarmiyah_places_clean.json");
            document.body.appendChild(downloadAnchorNode); // مطلوب لعمل الزر في متصفحات الجوال
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
        }
    </script>
</body>
</html>
